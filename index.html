<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硫氢化钠 - 行舟梦将至，采撷繁星愁</title>
    <!-- 网页标签图标 (Favicon) - 极简几何帆船与明显的弯月 (高空悬挂) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f172a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 20 L22 20'/%3E%3Cpath d='M5 20 C5 20, 8 23, 14 23 C17 23, 19 20, 19 20'/%3E%3Cpath d='M9 20 L9 9'/%3E%3Cpath d='M9 9 L17 15 L9 17'/%3E%3Cpath d='M10 2 A 4 4 0 0 0 5 5 A 5 5 0 0 1 10 2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 顶部进度条：日月轮转（时间驱动） -->
    <header class="scroll-header" id="scroll-header">
        <div class="header-time" id="header-time">00:00:00</div>
        <div class="header-date" id="header-date">June 7th · Sun</div>
        <div class="sky-canvas">
            <div class="stars-layer" id="stars-layer"></div>
            <div class="sun-container" id="sun"><div class="sun-core"></div></div>
            <svg class="moon-container" id="moon" viewBox="0 0 24 24">
                <path id="moon-lit" class="moon-lit" d="M12 2 A10 10 0 0 1 12 22 A6 10 0 0 0 12 2" />
            </svg>
        </div>
        <div class="scroll-water"></div>
        <svg id="scroll-boat" class="scroll-boat-horizontal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 18 L22 18"/>
            <path d="M5 18 C5 18, 8 22, 14 22 C17 22, 19 18, 19 18"/>
            <path d="M9 18 L9 6"/>
            <path d="M9 6 L17 12 L9 14"/>
        </svg>
    </header>

    <div class="app-wrapper page-transition has-header">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="profile">
                <div class="profile-top">
                    <div class="avatar-wrap">
                        <img src="assets/avatar.jpg" alt="硫氢化钠" class="avatar" id="avatar" onerror="this.src='https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png'">
                        <svg class="avatar-celestial" id="avatar-celestial" viewBox="0 0 20 20">
                            <circle cx="10" cy="10" r="9" fill="#fbbf24" filter="url(#glow)" />
                            <defs><filter id="glow"><feGaussianBlur stdDeviation="1" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
                        </svg>
                    </div>
                    <div class="profile-info">
                        <h1 class="author-name">硫氢化钠</h1>
                        <p class="author-bio">想扎根嵌入式领域，顺便多学点全栈本事，在热爱的道路上前行。</p>
                    </div>
                </div>

                <div class="social-links">
                    <a href="https://github.com/NaHS2" target="_blank" class="social-link">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                        @NaHS2
                    </a>
                    <a href="mailto:nahs.lql@outlook.com" class="social-link">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        Outlook
                    </a>

                    <a href="https://space.bilibili.com/549713964" target="_blank" class="social-link">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="4" ry="4"></rect><polyline points="8 3 12 7 16 3"></polyline></svg>
                        BiliBili
                    </a>
                    <a href="downloads.html" class="social-link">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        下载
                    </a>
                </div>
            </div>
        </aside>

        <!-- 主内容区：排版干净的列表 -->
        <main class="main-content">
            <div class="nav-tabs">
                <button class="tab-btn active" data-category="all">全部文章</button>
                <button class="tab-btn" data-category="tech">实践心得</button>
                <button class="tab-btn" data-category="life">生活随笔</button>
            </div>
            
            <div id="post-list" class="post-list">
                <p style="color: var(--gray-400);">数据加载中...</p>
            </div>
            
            <footer class="footer">
                <p>&copy; 2026 硫氢化钠. Crafted with focus.</p>
            </footer>
        </main>
    </div>

    <script>
        // iOS Safari 必须注册 touchstart 才能让 :active 伪类生效
        document.addEventListener('touchstart', function() {}, { passive: true });

        let allPosts = [];

        // 使用时间戳防止浏览器缓存 posts.json 导致无法看到最新更新
        fetch('posts.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(posts => {
                allPosts = posts;
                // 按日期降序排列，保证首页始终按时间顺序展示
                allPosts.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderPosts('all'); // 默认显示全部文章
            })
            .catch(error => {
                document.getElementById('post-list').innerHTML = '<p style="color: red;">加载失败，请检查网络或配置。</p>';
                console.error('Error loading posts:', error);
            });

        // 渲染文章列表
        function renderPosts(category) {
            const postList = document.getElementById('post-list');
            postList.innerHTML = ''; 
            
            // 根据分类过滤文章
            let filteredPosts = allPosts;
            if (category === 'tech') {
                // 定义属于“技术”的标签关键词
                const techTags = ['单片机', '嵌入式', '物联网', '开发', '硬件', '焊接', '课程设计', '工具', '开源', 'PCB', 'C语言', '算法'];
                filteredPosts = allPosts.filter(p => p.tags && p.tags.some(t => techTags.some(keyword => t.includes(keyword))));
            } else if (category === 'life') {
                // 定义属于“生活”的标签关键词
                const lifeTags = ['生活', '随笔', '随想', '校园', '感悟'];
                filteredPosts = allPosts.filter(p => p.tags && p.tags.some(t => lifeTags.some(keyword => t.includes(keyword))));
            }

            if (filteredPosts.length === 0) {
                postList.innerHTML = '<p style="color: var(--gray-400);">该分类下暂无文章</p>';
                return;
            }

            // 辅助函数：创建卡片 DOM 元素
            const createPostCard = (post, delayIndex) => {
                const a = document.createElement('a');
                a.href = `post.html?id=${post.id}`;
                a.className = 'post-item';
                a.style.animation = `fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards ${delayIndex * 0.1}s`;
                
                let tagsHtml = '';
                if (post.tags && post.tags.length > 0) {
                    tagsHtml = `<div class="tags">` + 
                        post.tags.map(tag => `<span class="tag">${tag}</span>`).join('') + 
                        `</div>`;
                }
                
                const readTimeHtml = post.readTime ? `<span class="meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> ${post.readTime}</span>` : '';

                a.innerHTML = `
                    <h3 class="post-title">${post.title}</h3>
                    <p class="post-excerpt">${post.excerpt}</p>
                    <div class="post-meta">
                        <span class="meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> ${post.date.replace(/-/g, '.')}</span>
                        ${readTimeHtml}
                        ${tagsHtml}
                    </div>
                `;
                return a;
            };

            // 技术分类下显示合集，其他分类平铺
            if (category === 'tech') {
                const collections = {};
                const others = [];

                filteredPosts.forEach(post => {
                    if (post.collection) {
                        if (!collections[post.collection]) collections[post.collection] = [];
                        collections[post.collection].push(post);
                    } else {
                        others.push(post);
                    }
                });

                let delayIndex = 0;

                // 渲染合集
                for (const [collName, collPosts] of Object.entries(collections)) {
                    const header = document.createElement('div');
                    header.className = 'collection-header';
                    header.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                        合集：${collName}
                    `;
                    header.style.animation = `fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards ${delayIndex * 0.1}s`;
                    postList.appendChild(header);
                    delayIndex++;

                    const collList = document.createElement('div');
                    collList.className = 'collection-list';
                    collPosts.forEach(post => {
                        collList.appendChild(createPostCard(post, delayIndex++));
                    });
                    postList.appendChild(collList);
                }

                // 渲染单篇技术文章
                if (others.length > 0) {
                    if (Object.keys(collections).length > 0) {
                        const header = document.createElement('div');
                        header.className = 'collection-header';
                        header.innerHTML = `
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                            单篇教程
                        `;
                        header.style.animation = `fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards ${delayIndex * 0.1}s`;
                        postList.appendChild(header);
                        delayIndex++;
                    }
                    
                    const collList = document.createElement('div');
                    collList.className = 'collection-list';
                    others.forEach(post => {
                        collList.appendChild(createPostCard(post, delayIndex++));
                    });
                    postList.appendChild(collList);
                }

            } else {
                // 全部/生活分类正常平铺渲染
                filteredPosts.forEach((post, index) => {
                    postList.appendChild(createPostCard(post, index));
                });
            }
        }

        // 标签切换逻辑
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                const category = e.target.getAttribute('data-category');
                renderPosts(category);
            });
        });

        // ====== 文章卡片点击缩放动画 ======
        document.getElementById('post-list').addEventListener('click', (e) => {
            const card = e.target.closest('.post-item');
            if (!card) return;
            e.preventDefault();
            card.style.transform = 'scale(0.97)';
            card.style.transition = 'transform 0.12s ease';
            setTimeout(() => {
                card.style.transform = '';
                window.location.href = card.href;
            }, 120);
        });

        // ==== 时钟与日期 ==================================================
        (function() {
            const weekNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const monthFull = ['January','February','March','April','May','June','July','August','September','October','November','December'];

            function ordinal(n) {
                const s = ['th','st','nd','rd'];
                const v = n % 100;
                return n + (s[(v - 20) % 10] || s[v] || s[0]);
            }

            function pad(n) { return n < 10 ? '0' + n : '' + n; }

            function updateClock() {
                const now = new Date();
                const h = now.getHours() + now.getMinutes() / 60;

                // 左上角时间 HH:MM:SS（拖拽时也更新）
                document.getElementById('header-time').textContent =
                    pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

                // 拖拽期间不更新头像环色和日月点，避免冲突
                if (window._boatDragging) return;

                // 头像环色+日月点(每秒更新，所有值硬编码防跳)
                const aw = document.getElementById('avatar');
                const dot = document.getElementById('avatar-celestial');
                const SIZE = window.innerWidth >= 768 ? 100 : 72;
                const cx = SIZE / 2, cy = SIZE / 2, orbitR = SIZE / 2 + 5;

                // 时间→天空色(与进度条同源)
                let sp;
                if      (h < 5)    sp = 0.94 + (h / 5) * 0.06;
                else if (h < 7)    sp = 0.00 + ((h - 5) / 2) * 0.12;
                else if (h < 11)   sp = 0.12 + ((h - 7) / 4) * 0.30;
                else if (h < 14)   sp = 0.42 + ((h - 11) / 3) * 0.13;
                else if (h < 17)   sp = 0.55 + ((h - 14) / 3) * 0.17;
                else if (h < 19.5) sp = 0.72 + ((h - 17) / 2.5) * 0.20;
                else               sp = 0.92 + ((h - 19.5) / 4.5) * 0.08;
                const stops = [[26,26,46],[200,95,80],[135,190,220],[74,144,217],[240,175,85],[200,85,115],[26,26,46]];
                const stopP = [0,0.05,0.18,0.48,0.70,0.88,1];
                let lo=stops[0],hi=stops[stops.length-1],lop=stopP[0],hip=stopP[stopP.length-1];
                for(let i=0;i<stopP.length-1;i++){if(sp>=stopP[i]&&sp<=stopP[i+1]){lo=stops[i];hi=stops[i+1];lop=stopP[i];hip=stopP[i+1];break;}}
                const t=hip===lop?0:(sp-lop)/(hip-lop);
                const cr=Math.round(lo[0]+(hi[0]-lo[0])*t),cg=Math.round(lo[1]+(hi[1]-lo[1])*t),cb=Math.round(lo[2]+(hi[2]-lo[2])*t);
                if(aw) aw.style.borderColor = `rgb(${cr},${cg},${cb})`;

                // 日月点：标准钟表盘面 + 太阳圆/真实月相SVG
                if(dot){
                    const angle = (1.5 + h / 6) * Math.PI;
                    const isNight = sp < 0.03 || sp > 0.91;
                    dot.classList.toggle('night', isNight);
                    const halfSvg = window.innerWidth >= 768 ? 9 : 7;
                    dot.style.left = (cx + orbitR * Math.cos(angle) - halfSvg) + 'px';
                    dot.style.top = (cy + orbitR * Math.sin(angle) - halfSvg) + 'px';

                    if(isNight){
                        const nowD = new Date();
                        const y=nowD.getFullYear(),m=nowD.getMonth()+1,d=nowD.getDate();
                        let jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d-1524;
                        if(m<=2) jd=Math.floor(365.25*(y+4715))+Math.floor(30.6001*(m+13))+d-1524;
                        let mp=((jd-2451550.1)%29.53058867)/29.53058867;
                        if(mp<0) mp+=1;
                        const cosT=Math.cos(2*Math.PI*mp), rx=Math.abs(cosT)*10;
                        let moonPath;
                        if(mp<0.003||mp>0.997) moonPath='';
                        else if(Math.abs(mp-0.5)<0.003) moonPath='M12 2 A10 10 0 1 1 12 22 A10 10 0 1 1 12 2';
                        else if(mp<0.5){const sw=cosT>=0?0:1;moonPath=`M12 2 A10 10 0 0 1 12 22 A${rx} 10 0 0 ${sw} 12 2`;}
                        else{const sw=cosT>=0?1:0;moonPath=`M12 2 A10 10 0 0 0 12 22 A${rx} 10 0 0 ${sw} 12 2`;}
                        dot.innerHTML = `<path d="${moonPath}" fill="#fef9c3"/>`;
                    }else{
                        dot.innerHTML = '<circle cx="12" cy="12" r="9" fill="#fbbf24" filter="url(#sunGlow)"/><defs><filter id="sunGlow"><feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
                    }
                }

                // 顶部日期 June 7th · Sun
                document.getElementById('header-date').textContent =
                    monthFull[now.getMonth()] + ' ' + ordinal(now.getDate()) + ' · ' + weekNames[now.getDay()];
            }

            updateClock();
            setInterval(updateClock, 1000);
        })();

        // ==== 日月轮转进度条（时间驱动，非滚动） ==========================
        (function() {
            const header = document.getElementById('scroll-header');
            const boat = document.getElementById('scroll-boat');
            const sunEl = document.getElementById('sun');
            const moonEl = document.getElementById('moon');
            const moonLit = document.getElementById('moon-lit');
            const starsLayer = document.getElementById('stars-layer');
            if (!header || !boat) return;

            const skyStops = [
                { p:0.00, top:[26,26,46],    bot:[45,27,78]   },
                { p:0.05, top:[200,95,80],   bot:[245,180,140] },
                { p:0.18, top:[135,190,220], bot:[200,228,242] },
                { p:0.48, top:[74,144,217],  bot:[175,215,240] },
                { p:0.70, top:[240,175,85],  bot:[250,218,165] },
                { p:0.88, top:[200,85,115],  bot:[235,160,178] },
                { p:1.00, top:[26,26,46],    bot:[45,27,78]   },
            ];

            function lerp(a,b,t){return[Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)];}
            function skyColor(p){
                let lo=skyStops[0],hi=skyStops[skyStops.length-1];
                for(let i=0;i<skyStops.length-1;i++){if(p>=skyStops[i].p&&p<=skyStops[i+1].p){lo=skyStops[i];hi=skyStops[i+1];break;}}
                const t=hi.p===lo.p?0:(p-lo.p)/(hi.p-lo.p);
                return {top:lerp(lo.top,hi.top,t),bot:lerp(lo.bot,hi.bot,t)};
            }

            // 月相（同 post.html）
            function getMoonPhase(d){
                const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
                let jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+day-1524;
                if(m<=2) jd=Math.floor(365.25*(y+4715))+Math.floor(30.6001*(m+13))+day-1524;
                let phase=((jd-2451550.1)%29.53058867)/29.53058867;
                if(phase<0) phase+=1;
                return phase;
            }
            function getMoonPath(phase){
                const R=10,cx=12,cy=12,cosT=Math.cos(2*Math.PI*phase),rx=Math.abs(cosT)*R;
                if(phase<0.003||phase>0.997)return'';
                if(Math.abs(phase-0.5)<0.003)return`M ${cx} ${cy-R} A ${R} ${R} 0 1 1 ${cx} ${cy+R} A ${R} ${R} 0 1 1 ${cx} ${cy-R}`;
                if(phase<0.5){const sw=cosT>=0?0:1;return`M ${cx} ${cy-R} A ${R} ${R} 0 0 1 ${cx} ${cy+R} A ${rx} ${R} 0 0 ${sw} ${cx} ${cy-R}`;}
                const sw=cosT>=0?1:0;return`M ${cx} ${cy-R} A ${R} ${R} 0 0 0 ${cx} ${cy+R} A ${rx} ${R} 0 0 ${sw} ${cx} ${cy-R}`;
            }

            // 当天月相
            moonLit.setAttribute('d', getMoonPath(getMoonPhase(new Date())));

            // 星星
            let sf='';
            for(let s=0;s<28;s++) sf+=`<div class="star" style="left:${2+Math.random()*96}%;top:${4+Math.random()*55}%;--twinkle-dur:${1.8+Math.random()*3.5}s;--twinkle-delay:${Math.random()*4}s"></div>`;
            starsLayer.innerHTML=sf;

            // 时间→天空位置映射
            function getTimePct(){
                const n=new Date();
                const h=n.getHours()+n.getMinutes()/60+n.getSeconds()/3600;
                if(h<5)   return 0.94+(h/5)*0.06;
                if(h<7)   return 0.00+((h-5)/2)*0.12;
                if(h<11)  return 0.12+((h-7)/4)*0.30;
                if(h<14)  return 0.42+((h-11)/3)*0.13;
                if(h<17)  return 0.55+((h-14)/3)*0.17;
                if(h<19.5)return 0.72+((h-17)/2.5)*0.20;
                return 0.92+((h-19.5)/4.5)*0.08;
            }

            function update(){
                const p=getTimePct();
                const hh=header.offsetHeight;
                const colors=skyColor(p);
                header.style.setProperty('--sky-top',`rgb(${colors.top.join(',')})`);

                // 全局氛围色：与进度条天空同源
                const aR=Math.round(colors.top[0]*0.18+209),aG=Math.round(colors.top[1]*0.18+209),aB=Math.round(colors.top[2]*0.18+209);
                document.body.style.setProperty('--page-ambient',`rgb(${aR},${aG},${aB})`);
                const dR=Math.round(colors.top[0]*0.30+179),dG=Math.round(colors.top[1]*0.30+179),dB=Math.round(colors.top[2]*0.30+179);
                document.body.style.setProperty('--page-accent',`rgb(${dR},${dG},${dB})`);

                // 太阳
                const sunRise=0.03,sunSet=0.91;
                const sunVis=p>=sunRise&&p<=sunSet?1:0;
                sunEl.style.opacity=sunVis;
                if(sunVis>0){
                    const t=(p-sunRise)/(sunSet-sunRise);
                    const arc=Math.sin(Math.PI*t);
                    sunEl.style.left=(5+t*88)+'%';
                    sunEl.style.top=(hh*.58-arc*(hh*.46))+'px';
                }

                // 月亮 & 星星
                const moonRise=0.88, moonSet=0.06;
                let moonT;
                if(p>moonRise) moonT=(p-moonRise)/(1-moonRise+moonSet);
                else if(p<moonSet) moonT=(1-moonRise+p)/(1-moonRise+moonSet);
                else moonT=-1;
                const moonVis=moonT<0?0:moonT<0.1?moonT/0.1:moonT>0.9?(1-moonT)/0.1:1;
                moonEl.style.opacity=moonVis;
                starsLayer.style.opacity=Math.max(0,Math.min(1,p<0.04||p>0.86?1:p<0.09?1-(p-0.04)/0.05:p>0.80?(p-0.80)/0.06:0));
                if(moonT>=0){
                    moonT=Math.max(0,Math.min(1,moonT));
                    moonEl.style.left=(5+moonT*88)+'%';
                    moonEl.style.right='auto';
                    moonEl.style.top=(hh*.58-Math.sin(Math.PI*moonT)*(hh*.46))+'px';
                }

                // 小船：白天从左到右航行
                boat.style.left=(p*100)+'%';
            }

            // 水花飞溅
            function splash(){
                if(!header)return;
                const bx=parseFloat(boat.style.left)||0;
                const dot=document.createElement('div');
                dot.className='water-splash';
                dot.style.left=(bx+Math.random()*6-3)+'%';
                dot.style.animationDuration=(0.5+Math.random()*0.5)+'s';
                header.appendChild(dot);
                setTimeout(()=>dot.remove(),800);
            }

            // ==== 小船拖拽预览 ============================================
            let dragging = false, dragPct = 0;
            window._boatDragging = false;
            boat.style.cursor = 'grab';
            boat.style.pointerEvents = 'auto';

            function applySky(p) {
                const hh = header.offsetHeight;
                const colors = skyColor(p);
                header.style.setProperty('--sky-top', `rgb(${colors.top.join(',')})`);
                // 头像环 + 日月点(p→24h轨道)
                const av = document.getElementById('avatar');
                if (av) {
                    av.style.borderColor = `rgb(${colors.top.join(',')})`;
                    const dot = document.getElementById('avatar-celestial');
                    if (dot) {
                        const SIZE = window.innerWidth >= 768 ? 100 : 72;
                        const cx = SIZE / 2, cy = SIZE / 2, orbitR = SIZE / 2 + 5;
                        const angle = (1.5 + p * 24 / 6) * Math.PI;
                        const isNight = p < 0.03 || p > 0.91;
                        dot.classList.toggle('night', isNight);
                        const halfSvg = window.innerWidth >= 768 ? 9 : 7;
                        dot.style.left = (cx + orbitR * Math.cos(angle) - halfSvg) + 'px';
                        dot.style.top = (cy + orbitR * Math.sin(angle) - halfSvg) + 'px';
                        if(isNight){
                            const nowD = new Date();
                            const y=nowD.getFullYear(),m=nowD.getMonth()+1,d=nowD.getDate();
                            let jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d-1524;
                            if(m<=2) jd=Math.floor(365.25*(y+4715))+Math.floor(30.6001*(m+13))+d-1524;
                            let mp=((jd-2451550.1)%29.53058867)/29.53058867;
                            if(mp<0) mp+=1;
                            const cosT=Math.cos(2*Math.PI*mp), rx=Math.abs(cosT)*10;
                            let moonPath;
                            if(mp<0.003||mp>0.997) moonPath='';
                            else if(Math.abs(mp-0.5)<0.003) moonPath='M12 2 A10 10 0 1 1 12 22 A10 10 0 1 1 12 2';
                            else if(mp<0.5){const sw=cosT>=0?0:1;moonPath=`M12 2 A10 10 0 0 1 12 22 A${rx} 10 0 0 ${sw} 12 2`;}
                            else{const sw=cosT>=0?1:0;moonPath=`M12 2 A10 10 0 0 0 12 22 A${rx} 10 0 0 ${sw} 12 2`;}
                            dot.innerHTML = `<path d="${moonPath}" fill="#fef9c3"/>`;
                        }else{
                            dot.innerHTML = '<circle cx="12" cy="12" r="9" fill="#fbbf24" filter="url(#sunGlow)"/><defs><filter id="sunGlow"><feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
                        }
                    }
                }
                // 氛围
                const aR = Math.round(colors.top[0]*0.18+209), aG = Math.round(colors.top[1]*0.18+209), aB = Math.round(colors.top[2]*0.18+209);
                document.body.style.setProperty('--page-ambient', `rgb(${aR},${aG},${aB})`);
                const dR = Math.round(colors.top[0]*0.30+179), dG = Math.round(colors.top[1]*0.30+179), dB = Math.round(colors.top[2]*0.30+179);
                document.body.style.setProperty('--page-accent', `rgb(${dR},${dG},${dB})`);
                // 太阳
                const sr = 0.03, ss = 0.91;
                const sv = p >= sr && p <= ss ? 1 : 0;
                sunEl.style.opacity = sv;
                if (sv > 0) {
                    const t = (p - sr) / (ss - sr);
                    sunEl.style.left = (5 + t * 88) + '%';
                    sunEl.style.top = (hh * .58 - Math.sin(Math.PI * t) * (hh * .46)) + 'px';
                }
                // 月亮 & 星星
                const moonRise=0.88, moonSet=0.06;
                let mT;
                if(p>moonRise) mT=(p-moonRise)/(1-moonRise+moonSet);
                else if(p<moonSet) mT=(1-moonRise+p)/(1-moonRise+moonSet);
                else mT=-1;
                const mV=mT<0?0:mT<0.1?mT/0.1:mT>0.9?(1-mT)/0.1:1;
                moonEl.style.opacity=mV;
                const ns=p<0.04||p>0.86?1:p<0.09?1-(p-0.04)/0.05:p>0.80?(p-0.80)/0.06:0;
                starsLayer.style.opacity=Math.max(0,Math.min(1,ns));
                if(mT>=0){
                    mT=Math.max(0,Math.min(1,mT));
                    moonEl.style.left=(5+mT*88)+'%';
                    moonEl.style.right='auto';
                    moonEl.style.top=(hh*.58-Math.sin(Math.PI*mT)*(hh*.46))+'px';
                }
                // 小船
                boat.style.left = (p * 100) + '%';
                boat.style.transition = dragging ? 'none' : 'left 0.8s cubic-bezier(0.34,1.56,0.64,1)';
            }

            function getBoatPct(clientX) {
                const rect = header.getBoundingClientRect();
                return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            }

            boat.addEventListener('mousedown', e => {
                dragging = true; window._boatDragging = true;
                dragPct = getBoatPct(e.clientX);
                boat.style.cursor = 'grabbing';
                applySky(dragPct);
                e.preventDefault();
            });
            boat.addEventListener('touchstart', e => {
                dragging = true; window._boatDragging = true;
                dragPct = getBoatPct(e.touches[0].clientX);
                applySky(dragPct);
                e.preventDefault();
            }, { passive: false });

            window.addEventListener('mousemove', e => {
                if (!dragging) return;
                dragPct = getBoatPct(e.clientX);
                applySky(dragPct);
            });
            window.addEventListener('touchmove', e => {
                if (!dragging) return;
                dragPct = getBoatPct(e.touches[0].clientX);
                applySky(dragPct);
            }, { passive: false });

            window.addEventListener('mouseup', () => {
                if (!dragging) return;
                dragging = false; window._boatDragging = false;
                boat.style.cursor = 'grab';
                applySky(getTimePct());
            });
            window.addEventListener('touchend', () => {
                if (!dragging) return;
                dragging = false; window._boatDragging = false;
                applySky(getTimePct());
            });

            update();
            setInterval(() => { if (!dragging) update(); }, 60000);
            setInterval(splash, 10000);
        })();

        // ====== 回到顶部按钮 ======
        const backToTop = document.createElement('button');
        backToTop.className = 'back-to-top';
        backToTop.setAttribute('aria-label', '回到顶部');
        backToTop.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>';
        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        document.body.appendChild(backToTop);

        window.addEventListener('scroll', () => {
            backToTop.classList.toggle('visible', window.scrollY > 400);
        }, { passive: true });
    </script>
</body>
</html>

    <script>
        let allPosts = [];

        // 使用时间戳防止浏览器缓存 posts.json 导致无法看到最新更新
        fetch('posts.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(posts => {
                allPosts = posts;
                // 按日期降序排列，保证首页始终按时间顺序展示
                allPosts.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderPosts('all'); // 默认显示全部文章
            })
            .catch(error => {
                document.getElementById('post-list').innerHTML = '<p style="color: red;">加载失败，请检查网络或配置。</p>';
                console.error('Error loading posts:', error);
            });

        // 渲染文章列表
        function renderPosts(category) {
            const postList = document.getElementById('post-list');
            postList.innerHTML = ''; 
            
            // 根据分类过滤文章
            let filteredPosts = allPosts;
            if (category === 'tech') {
                // 定义属于“技术”的标签关键词
                const techTags = ['技术', '嵌入式', '物联网', '开发', '工具', '开源', '代码'];
                filteredPosts = allPosts.filter(p => p.tags && p.tags.some(t => techTags.some(keyword => t.includes(keyword))));
            } else if (category === 'life') {
                // 定义属于“生活”的标签关键词
                const lifeTags = ['生活', '随笔', '随想', '校园', '感悟'];
                filteredPosts = allPosts.filter(p => p.tags && p.tags.some(t => lifeTags.some(keyword => t.includes(keyword))));
            }

            if (filteredPosts.length === 0) {
                postList.innerHTML = '<p style="color: var(--gray-400);">该分类下暂无文章</p>';
                return;
            }

            // 辅助函数：创建卡片 DOM 元素
            const createPostCard = (post, delayIndex) => {
                const a = document.createElement('a');
                a.href = `post.html?id=${post.id}`;
                a.className = 'post-item';
                a.style.animation = `fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards ${delayIndex * 0.1}s`;
                
                let tagsHtml = '';
                if (post.tags && post.tags.length > 0) {
                    tagsHtml = `<div class="tags">` + 
                        post.tags.map(tag => `<span class="tag">${tag}</span>`).join('') + 
                        `</div>`;
                }
                
                const readTimeHtml = post.readTime ? `<span class="meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> ${post.readTime}</span>` : '';

                a.innerHTML = `
                    <h3 class="post-title">${post.title}</h3>
                    <p class="post-excerpt">${post.excerpt}</p>
                    <div class="post-meta">
                        <span class="meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> ${post.date}</span>
                        ${readTimeHtml}
                        ${tagsHtml}
                    </div>
                `;
                return a;
            };

            // 技术分类下显示合集，其他分类平铺
            if (category === 'tech') {
                const collections = {};
                const others = [];

                filteredPosts.forEach(post => {
                    if (post.collection) {
                        if (!collections[post.collection]) collections[post.collection] = [];
                        collections[post.collection].push(post);
                    } else {
                        others.push(post);
                    }
                });

                let delayIndex = 0;

                // 渲染合集
                for (const [collName, collPosts] of Object.entries(collections)) {
                    const header = document.createElement('div');
                    header.className = 'collection-header';
                    header.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                        合集：${collName}
                    `;
                    header.style.animation = `fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards ${delayIndex * 0.1}s`;
                    postList.appendChild(header);
                    delayIndex++;

                    const collList = document.createElement('div');
                    collList.className = 'collection-list';
                    collPosts.forEach(post => {
                        collList.appendChild(createPostCard(post, delayIndex++));
                    });
                    postList.appendChild(collList);
                }

                // 渲染单篇技术文章
                if (others.length > 0) {
                    if (Object.keys(collections).length > 0) {
                        const header = document.createElement('div');
                        header.className = 'collection-header';
                        header.innerHTML = `
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                            单篇教程
                        `;
                        header.style.animation = `fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards ${delayIndex * 0.1}s`;
                        postList.appendChild(header);
                        delayIndex++;
                    }
                    
                    const collList = document.createElement('div');
                    collList.className = 'collection-list';
                    others.forEach(post => {
                        collList.appendChild(createPostCard(post, delayIndex++));
                    });
                    postList.appendChild(collList);
                }

            } else {
                // 全部/生活分类正常平铺渲染
                filteredPosts.forEach((post, index) => {
                    postList.appendChild(createPostCard(post, index));
                });
            }
        }

        // 标签切换逻辑
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                const category = e.target.getAttribute('data-category');
                renderPosts(category);
            });
        });

        // ==== 日月时钟：公历 + 农历 ========================================
        (function() {
            // ---- 农历数据表 (1900-2100) ----
            const lunarInfo = [
                0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
                0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
                0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
                0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
                0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
                0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
                0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
                0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
                0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
                0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
                0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
                0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
                0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
                0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
                0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
                0x14b63,
            ];

            const gan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
            const zhi = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
            const zodiac = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
            const lunarMonthNames = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
            const lunarDayNames = [
                '','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
                '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
                '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十',
            ];
            const weekNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const monthFull = ['January','February','March','April','May','June','July','August','September','October','November','December'];

            function ordinal(n) {
                const s = ['th','st','nd','rd'];
                const v = n % 100;
                return n + (s[(v - 20) % 10] || s[v] || s[0]);
            }

            function leapMonth(y) { return lunarInfo[y - 1900] & 0xF; }
            function leapDays(y) { return leapMonth(y) ? ((lunarInfo[y - 1900] >> 16) & 1) ? 30 : 29 : 0; }
            function monthDays(y, m) {
                if (m > 12 && m - 12 !== leapMonth(y)) return 0;
                return (lunarInfo[y - 1900] >> (16 - (m > 12 ? m - 12 : m))) & 1 ? 30 : 29;
            }
            function yearDays(y) {
                let sum = 0;
                for (let i = 1; i <= 12; i++) sum += monthDays(y, i);
                return sum + leapDays(y);
            }

            function getLunar(date) {
                const baseDate = new Date(1900, 0, 31);
                let offset = Math.floor((date - baseDate) / 86400000);
                let year = 1900, totalDays = yearDays(year);

                while (offset >= totalDays) {
                    offset -= totalDays;
                    year++;
                    totalDays = yearDays(year);
                }

                const leap = leapMonth(year);
                let month = 1, isLeap = false;

                for (let m = 1; m <= 12 + (leap ? 1 : 0); m++) {
                    const realMonth = m > 12 ? m - 12 : m;
                    const md = monthDays(year, realMonth);
                    if (offset < md) {
                        month = realMonth;
                        if (m > 12) isLeap = true;
                        break;
                    }
                    offset -= md;
                }

                return {
                    year: year,
                    month: month,
                    day: offset + 1,
                    isLeap: isLeap,
                    yearGZ: gan[(year - 4) % 10] + zhi[(year - 4) % 12],
                    zodiac: zodiac[(year - 4) % 12],
                };
            }

            function pad(n) { return n < 10 ? '0' + n : '' + n; }

            function updateClock() {
                const now = new Date();
                const lun = getLunar(now);
                const h = now.getHours() + now.getMinutes() / 60;

                document.getElementById('clock-time').textContent =
                    pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

                // 格式：2026.06.07
                document.getElementById('clock-date').textContent =
                    now.getFullYear() + '.' + pad(now.getMonth() + 1) + '.' + pad(now.getDate());

                // 格式：June 7th · Sun
                document.getElementById('clock-sub').textContent =
                    monthFull[now.getMonth()] + ' ' + ordinal(now.getDate()) + ' · ' + weekNames[now.getDay()];

                const lunarStr = lun.yearGZ + '年 ' +
                    (lun.isLeap ? '闰' : '') + lunarMonthNames[lun.month - 1] + '月' +
                    lunarDayNames[lun.day] + ' · 属' + lun.zodiac;
                document.getElementById('clock-lunar').textContent = lunarStr;

                // 微型天空指示器
                const skyFill = document.getElementById('clock-sky-fill');
                const celestial = document.getElementById('clock-celestial');
                if (skyFill && celestial) {
                    // 天空填充：模拟日升日落进度
                    let skyPct;
                    if (h < 5)      skyPct = 5 + (h / 5) * 15;
                    else if (h < 7) skyPct = 20 + ((h - 5) / 2) * 25;
                    else if (h < 12) skyPct = 45 + ((h - 7) / 5) * 35;
                    else if (h < 17) skyPct = 80 - ((h - 12) / 5) * 30;
                    else if (h < 19.5) skyPct = 50 - ((h - 17) / 2.5) * 35;
                    else             skyPct = 15 + ((h - 19.5) / 4.5) * 5;
                    skyFill.style.width = Math.max(5, Math.min(100, skyPct)) + '%';

                    // 日月点位置
                    const dotPct = h < 5 ? 95 + (h / 5) * 5 : h < 19 ? 5 + ((h - 5) / 14) * 90 : 95 + ((h - 19) / 5) * 5;
                    celestial.style.left = Math.max(2, Math.min(98, dotPct)) + '%';

                    // 夜间模式
                    const isNight = h < 5.5 || h > 18.5;
                    celestial.classList.toggle('night', isNight);
                }
            }

            updateClock();
            setInterval(updateClock, 1000);
        })();

        // ==== 日月轮转进度条（时间驱动，非滚动） ==========================
        (function() {
            const header = document.getElementById('scroll-header');
            const boat = document.getElementById('scroll-boat');
            const sunEl = document.getElementById('sun');
            const moonEl = document.getElementById('moon');
            const moonLit = document.getElementById('moon-lit');
            const starsLayer = document.getElementById('stars-layer');
            if (!header || !boat) return;

            const skyStops = [
                { p:0.00, top:[26,26,46],    bot:[45,27,78]   },
                { p:0.05, top:[200,95,80],   bot:[245,180,140] },
                { p:0.18, top:[135,190,220], bot:[200,228,242] },
                { p:0.48, top:[74,144,217],  bot:[175,215,240] },
                { p:0.70, top:[240,175,85],  bot:[250,218,165] },
                { p:0.88, top:[200,85,115],  bot:[235,160,178] },
                { p:1.00, top:[26,26,46],    bot:[45,27,78]   },
            ];

            function lerp(a,b,t){return[Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)];}
            function skyColor(p){
                let lo=skyStops[0],hi=skyStops[skyStops.length-1];
                for(let i=0;i<skyStops.length-1;i++){if(p>=skyStops[i].p&&p<=skyStops[i+1].p){lo=skyStops[i];hi=skyStops[i+1];break;}}
                const t=hi.p===lo.p?0:(p-lo.p)/(hi.p-lo.p);
                return {top:lerp(lo.top,hi.top,t),bot:lerp(lo.bot,hi.bot,t)};
            }

            // 月相（同 post.html）
            function getMoonPhase(d){
                const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
                let jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+day-1524;
                if(m<=2) jd=Math.floor(365.25*(y+4715))+Math.floor(30.6001*(m+13))+day-1524;
                let phase=((jd-2451550.1)%29.53058867)/29.53058867;
                if(phase<0) phase+=1;
                return phase;
            }
            function getMoonPath(phase){
                const R=10,cx=12,cy=12,cosT=Math.cos(2*Math.PI*phase),rx=Math.abs(cosT)*R;
                if(phase<0.003||phase>0.997)return'';
                if(Math.abs(phase-0.5)<0.003)return`M ${cx} ${cy-R} A ${R} ${R} 0 1 1 ${cx} ${cy+R} A ${R} ${R} 0 1 1 ${cx} ${cy-R}`;
                if(phase<0.5){const sw=cosT>=0?0:1;return`M ${cx} ${cy-R} A ${R} ${R} 0 0 1 ${cx} ${cy+R} A ${rx} ${R} 0 0 ${sw} ${cx} ${cy-R}`;}
                const sw=cosT>=0?1:0;return`M ${cx} ${cy-R} A ${R} ${R} 0 0 0 ${cx} ${cy+R} A ${rx} ${R} 0 0 ${sw} ${cx} ${cy-R}`;
            }

            // 当天月相
            moonLit.setAttribute('d', getMoonPath(getMoonPhase(new Date())));

            // 星星
            let sf='';
            for(let s=0;s<28;s++) sf+=`<div class="star" style="left:${2+Math.random()*96}%;top:${4+Math.random()*55}%;--twinkle-dur:${1.8+Math.random()*3.5}s;--twinkle-delay:${Math.random()*4}s"></div>`;
            starsLayer.innerHTML=sf;

            // 时间→天空位置映射
            function getTimePct(){
                const n=new Date();
                const h=n.getHours()+n.getMinutes()/60+n.getSeconds()/3600;
                if(h<5)   return 0.94+(h/5)*0.06;
                if(h<7)   return 0.00+((h-5)/2)*0.12;
                if(h<11)  return 0.12+((h-7)/4)*0.30;
                if(h<14)  return 0.42+((h-11)/3)*0.13;
                if(h<17)  return 0.55+((h-14)/3)*0.17;
                if(h<19.5)return 0.72+((h-17)/2.5)*0.20;
                return 0.92+((h-19.5)/4.5)*0.08;
            }

            function update(){
                const p=getTimePct();
                const hh=header.offsetHeight;
                const colors=skyColor(p);
                header.style.setProperty('--sky-top',`rgb(${colors.top.join(',')})`);

                // 全局氛围色：与进度条天空同源
                const aR=Math.round(colors.top[0]*0.18+209),aG=Math.round(colors.top[1]*0.18+209),aB=Math.round(colors.top[2]*0.18+209);
                document.body.style.setProperty('--page-ambient',`rgb(${aR},${aG},${aB})`);
                const dR=Math.round(colors.top[0]*0.30+179),dG=Math.round(colors.top[1]*0.30+179),dB=Math.round(colors.top[2]*0.30+179);
                document.body.style.setProperty('--page-accent',`rgb(${dR},${dG},${dB})`);

                // 太阳
                const sunRise=0.03,sunSet=0.91;
                const sunVis=p>=sunRise&&p<=sunSet?1:0;
                sunEl.style.opacity=sunVis;
                if(sunVis>0){
                    const t=(p-sunRise)/(sunSet-sunRise);
                    const arc=Math.sin(Math.PI*t);
                    sunEl.style.left=(5+t*88)+'%';
                    sunEl.style.top=(hh*.58-arc*(hh*.46))+'px';
                }

                // 月亮 & 星星
                const night=p<0.04||p>0.86?1:p<0.09?1-(p-0.04)/0.05:p>0.80?(p-0.80)/0.06:0;
                moonEl.style.opacity=Math.max(0,Math.min(1,night));
                starsLayer.style.opacity=Math.max(0,Math.min(1,night));

                // 小船：白天从左到右航行
                boat.style.left=(p*100)+'%';
            }

            // 水花飞溅
            function splash(){
                if(!header)return;
                const bx=parseFloat(boat.style.left)||0;
                const dot=document.createElement('div');
                dot.className='water-splash';
                dot.style.left=(bx+Math.random()*6-3)+'%';
                dot.style.animationDuration=(0.5+Math.random()*0.5)+'s';
                header.appendChild(dot);
                setTimeout(()=>dot.remove(),800);
            }

            update();
            setInterval(update, 60000);
            setInterval(splash, 10000); // 每10秒轻轻飞溅
        })();
    </script>
</body>
</html>

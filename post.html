<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - 硫氢化钠</title>
    <!-- 网页标签图标 (Favicon) - 极简几何帆船与明显的弯月 (高空悬挂) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f172a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 20 L22 20'/%3E%3Cpath d='M5 20 C5 20, 8 23, 14 23 C17 23, 19 20, 19 20'/%3E%3Cpath d='M9 20 L9 9'/%3E%3Cpath d='M9 9 L17 15 L9 17'/%3E%3Cpath d='M10 2 A 4 4 0 0 0 5 5 A 5 5 0 0 1 10 2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/styles.css?v=20260905-performance">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <script src="/article-loader.js?v=20260905" defer></script>
</head>
<body class="post-page">
    <!-- 顶部进度条：日月轮转 + 行舟 -->
    <header class="scroll-header" id="scroll-header">
        <div class="header-time" id="header-time">00:00:00</div>
        <div class="header-date" id="header-date"></div>
        <div class="sky-canvas">
            <!-- 星星（夜间可见） -->
            <div class="stars-layer" id="stars-layer"></div>

            <!-- 太阳 -->
            <div class="sun-container" id="sun">
                <div class="sun-core"></div>
            </div>

            <!-- 月亮（月相跟随农历） -->
            <svg class="moon-container" id="moon" viewBox="0 0 24 24">
                <path id="moon-lit" class="moon-lit" d="M12 2 A10 10 0 0 1 12 22 A6 10 0 0 0 12 2" />
            </svg>
        </div>

        <!-- 水波涟漪（江面） -->
        <div class="scroll-water"></div>

        <!-- 孤舟（随滚动横向移动） -->
        <svg id="scroll-boat" class="scroll-boat-horizontal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 18 L22 18"/>
            <path d="M5 18 C5 18, 8 22, 14 22 C17 22, 19 18, 19 18"/>
            <path d="M9 18 L9 6"/>
            <path d="M9 6 L17 12 L9 14"/>
        </svg>
    </header>

    <!-- 返回按钮：固定在页面最上方，普通/纯净模式共用同一个样式 -->
    <a href="/index.html" class="back-btn-fixed" id="back-btn" aria-label="返回列表">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span class="back-btn-label">返回</span>
    </a>

    <!-- 纯净阅读切换：独立固定，不受header隐藏影响 -->
    <button class="pure-toggle" id="pure-toggle" aria-label="纯净阅读模式" title="切换纯净阅读模式">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        <span class="pure-toggle-label">纯净</span>
    </button>

    <!-- 文章页不再使用两栏布局，而是居中单栏 -->
    <div class="app-wrapper page-transition has-header" style="display: block; max-width: 900px; margin: 0 auto; position: relative;">

        <main class="main-content" style="max-width: 100%; margin: 0 auto;">
            
            <article class="article-header">
                <h1 id="post-title">加载中...</h1>
                <div class="article-header-meta-row">
                    <div class="post-meta" id="post-meta">
                        <!-- 动态插入 -->
                    </div>
                    <button type="button" class="article-share-trigger" id="article-share-trigger" aria-haspopup="dialog" aria-controls="article-share-modal" aria-expanded="false" hidden>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                        <span>分享</span>
                    </button>
                </div>
            </article>

            <div id="content" class="markdown-body">
                <p style="color: var(--gray-400);">文章解析中...</p>
            </div>

            <footer class="footer">
                <p>&copy; 2026 硫氢化钠. Crafted with focus.</p>
            </footer>
        </main>
    </div>

    <div class="article-share-modal" id="article-share-modal" hidden>
        <div class="article-share-backdrop" data-share-close></div>
        <section class="article-share-dialog" role="dialog" aria-modal="true" aria-label="分享文章" tabindex="-1">
            <button type="button" class="article-share-close" aria-label="关闭分享窗口" data-share-close>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div class="article-qr-frame">
                <canvas id="article-qr-canvas" width="1" height="1" aria-label="当前文章二维码"></canvas>
            </div>
            <div class="article-share-actions">
                <button type="button" class="article-share-btn article-share-btn-primary" id="copy-article-link">复制链接</button>
                <button type="button" class="article-share-btn" id="save-article-qr">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    保存二维码
                </button>
            </div>
            <p class="article-share-status" id="article-share-status" aria-live="polite"></p>
        </section>
    </div>


</body>
</html>

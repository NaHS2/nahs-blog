<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - 硫氢化钠</title>
    <!-- 目录式文章URL由本页承载，需在当前文档的head中单独声明Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f172a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 20 L22 20'/%3E%3Cpath d='M5 20 C5 20, 8 23, 14 23 C17 23, 19 20, 19 20'/%3E%3Cpath d='M9 20 L9 9'/%3E%3Cpath d='M9 9 L17 15 L9 17'/%3E%3Cpath d='M10 2 A 4 4 0 0 0 5 5 A 5 5 0 0 1 10 2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/styles.css?v=20260809-formula">
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <p style="padding: 2rem; text-align: center; color: #64748b;">文章加载中...</p>
    <script>
        // GitHub Pages没有服务端重写：使用自定义404承载 /文章ID/ 目录式URL。
        fetch('/post.html')
            .then(response => {
                if (!response.ok) throw new Error('文章页面模板加载失败');
                return response.text();
            })
            .then(template => {
                const documentTemplate = new DOMParser().parseFromString(template, 'text/html');
                document.body.className = documentTemplate.body.className;
                document.body.innerHTML = documentTemplate.body.innerHTML;

                document.body.querySelectorAll('script:not([src])').forEach(script => {
                    const executableScript = document.createElement('script');
                    executableScript.textContent = script.textContent;
                    script.replaceWith(executableScript);
                });
            })
            .catch(error => {
                document.body.innerHTML = '<p style="padding: 2rem; text-align: center; color: #ef4444;">文章加载失败，请返回首页重试。</p>';
                console.error(error);
            });
    </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #202124; }
      .label { font: 600 22px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #202124; }
      .desc { font: 400 17px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #657080; }
      .small { font: 500 16px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #657080; }
      .card { fill: #fff; stroke: #dfe3e8; stroke-width: 2; }
      .line { stroke: #8a94a3; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a94a3"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f5f7f9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <text x="60" y="64" class="title">Antigravity用量监控扩展结构</text>

  <rect x="60" y="112" width="320" height="150" rx="18" class="card"/>
  <circle cx="100" cy="153" r="16" fill="#6b9d5b"/>
  <text x="130" y="162" class="label">quotaManager.ts</text>
  <text x="90" y="204" class="desc">接口发现、请求、解析与同步调度</text>
  <text x="90" y="234" class="small">统一输出UsageData</text>

  <rect x="440" y="112" width="320" height="150" rx="18" class="card"/>
  <circle cx="480" cy="153" r="16" fill="#5b83c3"/>
  <text x="510" y="162" class="label">extension.ts</text>
  <text x="470" y="204" class="desc">激活扩展、注册命令与状态栏</text>
  <text x="470" y="234" class="small">生成悬浮详情SVG</text>

  <rect x="820" y="112" width="320" height="150" rx="18" class="card"/>
  <circle cx="860" cy="153" r="16" fill="#d6a23c"/>
  <text x="890" y="162" class="label">状态栏与悬浮窗</text>
  <text x="850" y="204" class="desc">紧凑百分比、长条与周额度圆环</text>
  <text x="850" y="234" class="small">点击打开命令菜单</text>

  <rect x="440" y="364" width="320" height="150" rx="18" class="card"/>
  <circle cx="480" cy="405" r="16" fill="#8c6cc4"/>
  <text x="510" y="414" class="label">usageProvider.ts</text>
  <text x="470" y="456" class="desc">扩展进程与Webview消息桥接</text>
  <text x="470" y="486" class="small">转发刷新、登录与设置命令</text>

  <rect x="820" y="364" width="320" height="150" rx="18" class="card"/>
  <circle cx="860" cy="405" r="16" fill="#d56b5e"/>
  <text x="890" y="414" class="label">侧边栏Webview</text>
  <text x="850" y="456" class="desc">白色原生界面与中英文切换</text>
  <text x="850" y="486" class="small">每秒更新重置倒计时</text>

  <path d="M380 187 H430" class="line" marker-end="url(#arrow)"/>
  <path d="M760 187 H810" class="line" marker-end="url(#arrow)"/>
  <path d="M600 262 V354" class="line" marker-end="url(#arrow)"/>
  <path d="M760 439 H810" class="line" marker-end="url(#arrow)"/>

  <rect x="60" y="364" width="320" height="150" rx="18" fill="#eef5eb" stroke="#cadbc5" stroke-width="2"/>
  <text x="90" y="411" class="label">UsageData</text>
  <text x="90" y="451" class="desc">四组百分比与重置时间</text>
  <text x="90" y="481" class="small">realtime / cached / fallback</text>
  <path d="M220 262 V354" class="line" marker-end="url(#arrow)"/>
  <path d="M380 439 H430" class="line" marker-end="url(#arrow)"/>

  <text x="60" y="590" class="small">数据只在QuotaManager中获取，状态栏和侧边栏共享同一份状态。</text>
</svg>
